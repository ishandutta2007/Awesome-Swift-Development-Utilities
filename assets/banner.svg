<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Swift Theme Gradient -->
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36" />
      <stop offset="50%" stop-color="#F05138" />
      <stop offset="100%" stop-color="#D9381E" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05138" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Radial Gradients -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F05138" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F05138" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Card Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: pulse1 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulse2 9s ease-in-out infinite;
        transform-origin: 1000px 260px;
      }
      .pipeline-line {
        stroke-dasharray: 8 12;
        animation: flowDash 20s linear infinite;
      }
      .pipeline-line-fast {
        stroke-dasharray: 6 10;
        animation: flowDashRev 14s linear infinite;
      }
      .bg-pill-1 {
        animation: floatPill1 6s ease-in-out infinite;
      }
      .bg-pill-2 {
        animation: floatPill2 8s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .mono-text {
        font-family: "SF Mono", Monaco, Menlo, Consolas, "Liberation Mono", Courier, monospace;
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 320; }
      }
      @keyframes pulse1 {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
        50% { transform: scale(1.25) translate(30px, 20px); opacity: 0.8; }
      }
      @keyframes pulse2 {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.3) translate(-40px, -20px); opacity: 0.75; }
      }
      @keyframes floatPill1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPill2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#253248" stroke-width="1.5" />

  <!-- Animated Ambient Glows (strictly behind background elements) -->
  <circle class="glow-orb-1" cx="180" cy="90" r="180" fill="url(#orbGlow1)" />
  <circle class="glow-orb-2" cx="1020" cy="270" r="210" fill="url(#orbGlow2)" />

  <!-- Animated Pipeline Streams (low opacity background graphics) -->
  <g opacity="0.22">
    <path class="pipeline-line" d="M-50,80 C300,40 500,180 850,90 C1050,40 1150,140 1250,110" fill="none" stroke="#F05138" stroke-width="2.5" />
    <path class="pipeline-line-fast" d="M-50,280 C250,310 480,210 750,270 C980,320 1120,240 1250,260" fill="none" stroke="#6366F1" stroke-width="2" />
    <path class="pipeline-line" d="M100,0 L350,360 M850,0 L1100,360" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
  </g>

  <!-- Geometric Grid Pattern (Subtle background accent) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.75">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Floating Background Tool Badges (Soft Opacity, placed far from text) -->
  <g class="bg-pill-1" opacity="0.45">
    <rect x="75" y="40" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="mono-text" x="140" y="62" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">tuist generate</text>
  </g>
  <g class="bg-pill-2" opacity="0.45">
    <rect x="990" y="45" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="mono-text" x="1060" y="67" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">fastlane release</text>
  </g>
  <g class="bg-pill-1" opacity="0.40">
    <rect x="980" y="280" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="mono-text" x="1055" y="302" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">swift test --parallel</text>
  </g>
  <g class="bg-pill-2" opacity="0.40">
    <rect x="70" y="280" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="mono-text" x="140" y="302" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">swiftlint analyze</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Bar & Logo -->
  <g id="foreground-content">
    <!-- Swift Bird Logo Silhouette -->
    <g transform="translate(600, 78) scale(0.9)">
      <!-- Swift Icon Badge -->
      <circle cx="0" cy="0" r="38" fill="url(#swiftGrad)" filter="url(#shadow)" />
      <!-- Stylized Swift Bird Outline -->
      <path d="M-18,-6 C-12,8 4,18 20,22 C14,14 10,7 6,0 C12,4 19,8 24,12 C16,-2 3,-18 -18,-24 C-10,-17 -2,-8 2,-2 C-8,-6 -14,-7 -18,-6 Z" fill="#FFFFFF" />
    </g>

    <!-- Top Tagline Badge -->
    <rect x="475" y="132" width="250" height="26" rx="13" fill="#1e293b" stroke="#f05138" stroke-opacity="0.6" stroke-width="1.2" />
    <text class="mono-text" x="600" y="149" fill="#FB923C" font-size="11.5" font-weight="700" letter-spacing="0.5" text-anchor="middle">SWIFT DEVELOPER ECOSYSTEM</text>

    <!-- Main Title (Crisp, High Contrast, Centered) -->
    <text class="title-text" x="600" y="196" fill="#FFFFFF" font-size="34" text-anchor="middle" filter="url(#shadow)">
      Awesome Swift Development Utilities
    </text>

    <!-- Subtitle (Clear, readable, high foreground hierarchy) -->
    <text class="subtitle-text" x="600" y="228" fill="#CBD5E1" font-size="16" text-anchor="middle">
      Curated Toolchain for Project Generation • CI/CD Pipelines • Dependency Management • Code Quality
    </text>

    <!-- Foreground Feature Capability Pills (Clean, crisp, legible) -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: Project Generation -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="#151e2e" stroke="#334155" stroke-width="1" />
        <text class="mono-text" x="82.5" y="20" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="middle">🛠️ Project Gen</text>
      </g>
      <!-- Pill 2: CI/CD Automation -->
      <g transform="translate(-185, 0)">
        <rect x="0" y="0" width="170" height="32" rx="16" fill="#151e2e" stroke="#334155" stroke-width="1" />
        <text class="mono-text" x="85" y="20" fill="#A855F7" font-size="12" font-weight="600" text-anchor="middle">🚀 CI/CD Pipelines</text>
      </g>
      <!-- Pill 3: Dependency Mgmt -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#151e2e" stroke="#334155" stroke-width="1" />
        <text class="mono-text" x="90" y="20" fill="#4ADE80" font-size="12" font-weight="600" text-anchor="middle">📦 Dependency Mgmt</text>
      </g>
      <!-- Pill 4: Code Quality -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="#151e2e" stroke="#334155" stroke-width="1" />
        <text class="mono-text" x="82.5" y="20" fill="#F43F5E" font-size="12" font-weight="600" text-anchor="middle">✨ Code Quality</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
